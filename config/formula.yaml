# MLB K Analyst — tunable scoring formula
# Adjust via the /tune Telegram command, e.g.:
#   /tune formula.recent_form_weight 0.65
#   /tune thresholds.min_edge 0.8
# Every change is logged to the formula_changes table.

formula:
  recent_form_weight: 0.7        # weight on last-30-day K%
  season_weight: 0.3             # weight on season K%
  bf_per_inning: 4.3             # batters faced per inning average
  league_avg_k_pct: 0.228        # league average K%; update annually
  min_starts_required: 3         # skip pitchers with fewer starts this season

thresholds:
  min_edge: 0.7                  # Ks above/below book line required
  min_confidence: 6              # confidence score 1-10
  max_picks_per_day: 4
  line_move_alert: 0.5           # alert when a pick's line moves this much

confidence_weights:
  base: 2
  edge_gte_1_5: 4                # massive edge
  edge_gte_1_0: 3
  edge_gte_0_7: 2
  starts_gte_5: 1                # sufficient sample size
  domed_park: 1                  # no weather risk
  ump_confirmed: 1
  ump_high_k_factor: 1           # top-quartile strikeout ump (factor >= 1.02)
  no_injury_flags: 1
  csw_aligns_with_k: 1           # CSW% supports K% (not a regression candidate)
  line_moved_toward_us: 1        # sharp money agrees
  line_moved_against_us: -2      # fade signal
  stale_data_penalty: -1         # applied per data source that fell back to cache

# ---------------------------------------------------------------------------
# HOME RUN picks (secondary module). Model probability a batter homers vs the
# book's "to hit a HR" implied probability.
# ---------------------------------------------------------------------------
homerun:
  enabled: true
  recent_form_weight: 0.7        # weight on last-30-day HR/PA
  season_weight: 0.3
  league_avg_hr_pa: 0.031        # league average HR per PA; update annually
  shrink_to_league: 0.25         # regress batter HR/PA toward league average
  expected_pa: 4.1               # PAs for a top-of-order bat
  min_pa_season: 100             # skip small-sample bats
  candidates_per_team: 5         # team HR leaders considered per game
  min_edge_prob: 0.04            # model P(HR) must beat implied prob by this
  max_plausible_edge: 0.15       # bigger "edges" are data errors — skip + flag
  min_confidence: 6
  max_picks_per_day: 2
  # temperature/wind effect on carry: multiplier per +10F above 70F, and per
  # 10 mph of wind (sign decided by park orientation is unknowable cheaply, so
  # wind only *reduces* confidence, never boosts the projection).
  temp_factor_per_10f: 1.03

# ---------------------------------------------------------------------------
# MONEYLINE value picks (tertiary module). Model win probability =
# Pythagorean team strength -> log5 matchup -> home-field edge -> starter
# quality shift (K-BB% gap). Compared to the best h2h price across books.
# ---------------------------------------------------------------------------
moneyline:
  enabled: true
  home_field_edge: 0.035         # league home teams win ~53.5%
  pythag_exponent: 1.83          # Pythagorean run-differential exponent
  shrink_to_mean: 0.20           # regress team strength toward .500
  starter_kbb_weight: 0.5        # win-prob shift per point of starter K-BB% gap
  max_starter_shift: 0.08        # cap on the starter adjustment
  min_edge_prob: 0.04            # model win% must beat implied by 4 points
  max_plausible_edge: 0.20       # bigger "edges" are data errors — skip + flag
  min_confidence: 6
  max_picks_per_day: 2
  show_board: true               # full-slate model-vs-market board on the card

