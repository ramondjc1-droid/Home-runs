name: MLB K Analyst — Daily Heartbeats

# GitHub Actions cron is UTC-only and ignores US daylight saving, so each ET
# target lists both candidate UTC hours (EDT / EST) and scripts/dispatch.py
# routes by WHICH cron fired. Duplicate fires are no-ops via per-day
# idempotency in the DB (the hourly pregame stage self-noops instead).
#
# ET target -> UTC candidates:
#   02:00 ET grader             06:00 / 07:00 UTC
#   10:00 ET morning_analysis   14:00 / 15:00 UTC
#   14:00 ET refresh_lines      18:00 / 19:00 UTC
#   pregame_check               hourly 17,20-23,0-3 UTC (game window)

# NOTE on minutes: GitHub's scheduler is massively congested at :00 — fires
# for this repo were observed 1-3 hours late. Off-peak minutes + an extra
# catch-up hour per stage keep delivery near-on-time; per-day idempotency
# makes duplicate fires no-ops.
on:
  schedule:
    - cron: "23 6,7,8 * * *"        # grader (2 AM ET + catch-ups)
    - cron: "47 13,14,15 * * *"     # morning_analysis (~9:47 AM ET + catch-ups)
    - cron: "17 18,19,20 * * *"     # refresh_lines (~2:17 PM ET + catch-ups)
    - cron: "37 17,20-23,0-3 * * *" # pregame_check (hourly game window)
  push:
    paths:
      - ".trigger"                  # commit a stage name to .trigger to force a run
  workflow_dispatch:
    inputs:
      stage:
        description: "Force a stage (grade | morning | lines | pregame). Blank = auto-pick by ET time."
        required: false
        default: ""
      dry_run:
        description: "true = preview only (nothing saved or sent to Telegram)"
        required: false
        default: "false"

concurrency:
  group: mlb-k-analyst-daily
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Runners are ephemeral; the SQLite DB (picks, grades, line history,
      # run-log idempotency, API cost tracking) must survive between runs.
      # Restore the newest cache; save under a fresh key each run.
      - name: Restore picks database
        uses: actions/cache/restore@v4
        with:
          path: data/picks.db
          key: picks-db-${{ github.run_id }}
          restore-keys: |
            picks-db-

      # Push-based trigger: the stage name lives in the committed .trigger
      # file. This path needs only git push access, so delivery can be forced
      # even when API/UI dispatch is unavailable.
      - name: Resolve stage
        id: stage
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -s .trigger ]; then
            echo "stage=$(head -1 .trigger | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
          else
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run stage
        run: >
          python scripts/dispatch.py
          --schedule "${{ github.event.schedule }}"
          --stage "${{ steps.stage.outputs.stage }}"
          --dry-run "${{ github.event.inputs.dry_run }}"

      - name: Save picks database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/picks.db
          key: picks-db-${{ github.run_id }}
